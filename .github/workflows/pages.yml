name: Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'playground/**'
      - 'scripts/check_pages.mjs'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  MOONBIT_VERSION: latest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit + update registry (retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_VERSION"
            echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
            "$HOME/.moon/bin/moon" update
      - name: Build playground JS
        run: moon build --target js --release playground
      - name: Sync docs artifact
        run: cp _build/js/release/build/playground/playground.js docs/playground.js
      - name: Pages gate (structure / exports / semantics)
        run: node scripts/check_pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
