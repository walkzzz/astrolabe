name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install moon toolchain
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash

      - name: Add moon to PATH
        run: echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Check all targets (deny warnings)
        run: moon check --deny-warn --target all

      - name: Test all targets
        run: moon test --target all

      - name: Bench (native)
        run: moon bench --target native benchmarks/
